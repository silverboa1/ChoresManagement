{% extends "base.html" %}

{% block title %}Видалення завдання{% endblock %}

{% block content %}
<div class="container">
  <h2>Видалити завдання?</h2>
  <p>Ви впевнені, що хочете видалити завдання <strong>{{ 
object.name
 }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Так, видалити</button>
    <a href="{% url 'tasks:list' %}" class="btn btn-secondary">Скасувати</a>
  </form>
</div>
{% endblock %}
