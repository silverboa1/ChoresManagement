{% load static %}
<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Домашні справи{% endblock %} — FamilyTasks</title>
  <meta name="description" content="Керування хатніми справами для батьків та дітей">

  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <div class="app-root">
    <header class="site-header">
      <div class="container header-inner">
        <span class="brand">
          <span class="brand-logo" aria-hidden="true">🏠</span>
          <span class="brand-text">FamilyTasks</span>
        </span>
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
