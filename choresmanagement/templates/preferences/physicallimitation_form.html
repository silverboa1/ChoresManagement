{% extends 'base.html' %}

{% block title %}{% if 
form.instance.pk
 %}Редагувати{% else %}Додати{% endif %} обмеження{% endblock %}

{% block content %}
<h1>{% if 
form.instance.pk
 %}Редагувати{% else %}Додати{% endif %} обмеження</h1>

<form method="post">
    {% csrf_token %}
    <table class="form-table">
        {{ form.as_table }}
    </table>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">{% if 
form.instance.pk
 %}Зберегти{% else %}Додати{% endif %}</button>
        <a href="{% url 'preferences:limitation_list' %}" class="btn btn-secondary">Скасувати</a>
    </div>
</form>
{% endblock %}
