{% extends 'base.html' %}

{% block title %}Видалення обмеження — {{ 
limitation.name
 }}{% endblock %}

{% block content %}
<h1>Видалити обмеження</h1>

<p>Ви впевнені, що хочете видалити "<strong>{{ 
limitation.name
 }}</strong>"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Видалити</button>
    <a href="{% url 'preferences:limitation_list' %}" class="btn btn-secondary">Скасувати</a>
</form>
{% endblock %}
